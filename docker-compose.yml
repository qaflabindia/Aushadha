services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-aushadha}
      - POSTGRES_USER=${POSTGRES_USER:-aushadha_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=neo4j
      - SESSION_SECRET=${SESSION_SECRET}
      # Google Cloud: use the host's Application Default Credentials (gcloud auth application-default login)
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID:-maharishifacts-d04a7}
      # Google Sign-In: backend must verify tokens for the same OAuth client the frontend uses
      - GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-256164019269-o0174fcoksuls9hf9b9nkto42fc1c649.apps.googleusercontent.com}
      # CORS: allow the frontend's published origin
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-8080},http://127.0.0.1:${FRONTEND_PORT:-8080}}
    depends_on:
      - postgres
      - neo4j
    networks:
      - net
    volumes:
      - ./backend:/code
      - ${HOME}/.config/gcloud/application_default_credentials.json:/secrets/gcp/application_default_credentials.json:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_API_URL=http://localhost:8000
        - VITE_LLM_MODELS=${VITE_LLM_MODELS:-gemini_2.0_flash,gemini_2.5_flash,gemini_2.5_pro,openai_gpt_5_mini,diffbot}
        - VITE_LLM_MODELS_PROD=${VITE_LLM_MODELS_PROD:-gemini_2.0_flash,gemini_2.5_flash,openai_gpt_5_mini,diffbot}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-256164019269-o0174fcoksuls9hf9b9nkto42fc1c649.apps.googleusercontent.com}
    container_name: frontend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      - backend
    networks:
      - net

  neo4j:
    image: neo4j:5.23.0
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc", "bloom", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*,bloom.*
      - NEO4J_server_memory_heap_initial__size=256M
      - NEO4J_server_memory_heap_max__size=256M
      - NEO4J_server_memory_pagecache_size=256M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - net

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-aushadha}
      - POSTGRES_USER=${POSTGRES_USER:-aushadha_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    networks:
      - net

networks:
  net:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data:
