# Public demo deployment: layered on top of the root docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
#
# Differences from local development:
# - Only Caddy is published (ports 80/443, HTTPS via Let's Encrypt). Neo4j, Postgres and
#   the backend are reachable only on the internal Docker network.
# - Every backend route requires a signed-in user (REQUIRE_AUTH_ALL), and unknown Google
#   accounts cannot sign themselves up (ALLOW_GOOGLE_SIGNUP=false).
# - Google Cloud access comes from the VM's service account (metadata server), not from a
#   credentials file.
# APP_HOST and API_HOST come from the root .env written by deploy/remote-setup.sh.

services:
  backend:
    ports: !reset []
    restart: unless-stopped
    environment: !override
      - APP_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-aushadha}
      - POSTGRES_USER=${POSTGRES_USER:-aushadha_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=neo4j
      - SESSION_SECRET=${SESSION_SECRET}
      - INCLUDE_OLLAMA=no
      - GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID}
      - GCP_REGION=${GCP_REGION:-global}
      - GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
      - ALLOWED_ORIGINS=https://${APP_HOST}
      - REQUIRE_AUTH_ALL=true
      - ALLOW_GOOGLE_SIGNUP=false
    volumes: !override
      - ./backend:/code
      - ./deploy/demo_docs:/demo_docs:ro

  frontend:
    ports: !reset []
    restart: unless-stopped
    build:
      args:
        - VITE_BACKEND_API_URL=https://${API_HOST}

  neo4j:
    ports: !reset []
    restart: unless-stopped
    environment:
      - NEO4J_server_memory_heap_initial__size=2G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=2G

  postgres:
    ports: !reset []
    restart: unless-stopped

  caddy:
    image: caddy:2.8
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APP_HOST=${APP_HOST}
      - API_HOST=${API_HOST}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - net

volumes:
  caddy_data:
  caddy_config:
