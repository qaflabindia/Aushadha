<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aushadha Help Centre</title>
<!--
  Aushadha Help Centre: one self-contained document.
  - Editable text carries data-edit-id. Admins edit it in place (Edit mode in the toolbar).
  - Edits and the audit trail live in the JSON block #help-edits near the end of this file.
    The backend (src/routers/help_router.py) rewrites only that block. Edits are applied as
    plain text, never as HTML.
  - Shown inside the app's floating Help Centre window, in a sandboxed frame. It talks to the
    app by postMessage (see HelpCentreWindow.tsx).
  How to change the structure (add a section, topic, step or picture): edit
  backend/help/content.json and run backend/help/build_help.py, which rebuilds help-centre.html
  from this template. Admin text edits are kept, matched by data-edit-id.
-->
<style>
  :root {
    --bg: #0b0b0d; --panel: rgba(255,255,255,0.035); --panel-strong: rgba(255,255,255,0.06);
    --line: rgba(212,175,55,0.16); --line-strong: rgba(212,175,55,0.38);
    --text: #f4efe3; --muted: rgba(244,239,227,0.62); --faint: rgba(244,239,227,0.38);
    --accent: #D4AF37; --accent-soft: rgba(212,175,55,0.12); --accent-ink: #0b0b0d;
    --ok: #6fcf97; --bad: #eb5757; --shadow: 0 18px 40px rgba(0,0,0,0.45);
  }
  :root[data-theme="light"] {
    --bg: #fbfaf6; --panel: rgba(154,123,47,0.04); --panel-strong: rgba(154,123,47,0.08);
    --line: rgba(154,123,47,0.16); --line-strong: rgba(154,123,47,0.4);
    --text: #1d1b16; --muted: rgba(29,27,22,0.66); --faint: rgba(29,27,22,0.42);
    --accent: #9A7B2F; --accent-soft: rgba(154,123,47,0.1); --accent-ink: #ffffff;
    --ok: #1e8e4e; --bad: #c0392b; --shadow: 0 16px 36px rgba(60,45,10,0.14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 220px 1fr; height: 100%; }
  nav.side {
    border-right: 1px solid var(--line); padding: 20px 12px; overflow-y: auto;
    background: linear-gradient(180deg, var(--accent-soft), transparent 40%);
  }
  .brand { padding: 0 10px 18px; }
  .brand .eyebrow { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .brand .name { font-size: 17px; font-weight: 800; letter-spacing: -.01em; margin-top: 2px; }
  .navlink {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 9px 10px; border: 0; border-radius: 10px; background: transparent;
    color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 500;
    transition: background .15s, color .15s;
  }
  .navlink:hover { background: var(--panel-strong); color: var(--text); }
  .navlink.active { background: var(--accent-soft); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }
  .navlink svg { width: 16px; height: 16px; flex: none; color: var(--accent); }
  main { overflow-y: auto; scroll-behavior: smooth; }
  .toolbar {
    position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; align-items: center;
    padding: 12px 24px; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(14px); border-bottom: 1px solid var(--line);
  }
  .search { flex: 1; position: relative; }
  .search input {
    width: 100%; padding: 9px 12px 9px 34px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font: inherit; outline: none;
  }
  .search input:focus { border-color: var(--line-strong); }
  .search svg { position: absolute; left: 11px; top: 50%; width: 15px; height: 15px; transform: translateY(-50%); color: var(--faint); }
  .tbtn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 12px; font-weight: 600;
    white-space: nowrap;
  }
  .tbtn:hover { border-color: var(--line-strong); }
  .tbtn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .tbtn svg { width: 14px; height: 14px; }
  .admin-only { display: none !important; }
  body.is-admin .admin-only { display: inline-flex !important; }
  .content { padding: 28px 24px 64px; max-width: 860px; margin: 0 auto; }
  .hero {
    border: 1px solid var(--line); border-radius: 18px; padding: 26px 24px; margin-bottom: 28px;
    background: radial-gradient(120% 140% at 0% 0%, var(--accent-soft), transparent 55%), var(--panel);
  }
  .hero .eyebrow { font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .hero h1 { margin: 6px 0 6px; font-size: 26px; line-height: 1.2; letter-spacing: -.02em; }
  .hero p { margin: 0; color: var(--muted); max-width: 60ch; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chip {
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 12px;
    background: transparent; cursor: pointer; color: var(--muted);
  }
  .chip:hover { color: var(--text); border-color: var(--line-strong); }
  section.sec { margin-bottom: 34px; scroll-margin-top: 70px; }
  .sec-head { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
  .sec-icon {
    width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none;
    background: var(--accent-soft); color: var(--accent); border: 1px solid var(--line);
  }
  .sec-icon svg { width: 18px; height: 18px; }
  .sec h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  .sec .summary { margin: 2px 0 0; color: var(--muted); }
  .badge { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--line-strong); border-radius: 6px; padding: 1px 6px; margin-left: 8px; vertical-align: 2px; }
  details.topic {
    scroll-margin-top: 72px;
    border: 1px solid var(--line); border-radius: 14px; background: var(--panel); margin-bottom: 10px;
    transition: border-color .15s, box-shadow .15s;
  }
  details.topic[open] { border-color: var(--line-strong); box-shadow: var(--shadow); }
  details.topic summary {
    list-style: none; cursor: pointer; padding: 14px 16px; display: flex; align-items: center; gap: 10px;
    font-weight: 600;
  }
  details.topic summary::-webkit-details-marker { display: none; }
  details.topic summary .chev { margin-left: auto; width: 16px; height: 16px; color: var(--faint); transition: transform .2s; flex: none; }
  details.topic[open] summary .chev { transform: rotate(90deg); color: var(--accent); }
  .topic-body { padding: 0 16px 16px; }
  .topic-body p { margin: 0 0 12px; color: var(--muted); }
  ol.steps { list-style: none; counter-reset: step; padding: 0; margin: 0 0 14px; }
  ol.steps li { counter-increment: step; position: relative; padding: 2px 0 8px 34px; }
  ol.steps li::before {
    content: counter(step); position: absolute; left: 0; top: 1px; width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center; font-size: 11px; font-weight: 700;
    background: var(--accent-soft); color: var(--accent); border: 1px solid var(--line-strong);
  }
  figure { margin: 6px 0 12px; }
  figure img {
    width: 100%; display: block; border-radius: 10px; border: 1px solid var(--line); cursor: zoom-in;
    background: var(--panel-strong);
  }
  figcaption { font-size: 12px; color: var(--faint); margin-top: 6px; }
  .tip {
    display: flex; gap: 10px; padding: 10px 12px; border-radius: 10px; font-size: 13px;
    background: var(--accent-soft); border: 1px solid var(--line);
  }
  .tip strong { color: var(--accent); white-space: nowrap; }
  mark { background: var(--accent); color: var(--accent-ink); border-radius: 3px; padding: 0 2px; }
  .hidden, .role-hidden { display: none !important; }
  .meta-line { margin-top: 16px; font-size: 11px; color: var(--faint); letter-spacing: .02em; }
  .foot { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--faint); font-size: 12px; text-align: center; }
  .foot p { margin: 0 0 8px; }
  .support-link {
    display: inline-flex; align-items: center; gap: 8px; margin: 2px 0 12px; padding: 8px 12px; border-radius: 10px;
    border: 1px solid var(--line-strong); color: var(--accent); text-decoration: none; font-weight: 600; font-size: 13px;
  }
  .support-link:hover { background: var(--accent-soft); }
  .support-link svg { width: 15px; height: 15px; }
  .tabs { display: flex; gap: 6px; padding: 10px 16px 0; }
  .tabs button { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; color: var(--muted); }
  .tabs button.on { background: var(--accent-soft); color: var(--text); border-color: var(--line-strong); }
  .score { display: flex; gap: 10px; margin-bottom: 12px; }
  .score div { flex: 1; border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; background: var(--panel); }
  .score b { display: block; font-size: 20px; color: var(--accent); }
  .score span { font-size: 11px; color: var(--faint); }
  @keyframes flash { 0%, 60% { box-shadow: 0 0 0 2px var(--accent); } 100% { box-shadow: var(--shadow); } }
  details.topic.flash { animation: flash 1.6s ease-out; }
  details.topic summary .badge { margin-left: 4px; }
  .empty { text-align: center; color: var(--faint); padding: 40px 0; }

  /* Edit mode */
  body.editing [data-edit-id] { outline: 1px dashed var(--line-strong); outline-offset: 3px; border-radius: 4px; cursor: text; }
  body.editing [data-edit-id]:focus { outline: 2px solid var(--accent); background: var(--accent-soft); }
  [data-edit-id].saving { opacity: .55; }
  .reset-btn {
    display: none; margin-left: 6px; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    border: 1px solid var(--line-strong); color: var(--accent); background: transparent; border-radius: 6px; padding: 1px 6px; cursor: pointer;
    vertical-align: 2px;
  }
  body.editing .is-edited + .reset-btn { display: inline-block; }
  .edit-banner {
    display: none; margin: 0 0 18px; padding: 10px 14px; border-radius: 12px; font-size: 13px;
    border: 1px dashed var(--line-strong); color: var(--muted);
  }
  body.editing .edit-banner { display: block; }

  /* Audit trail drawer */
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); z-index: 20;
    background: var(--bg); border-left: 1px solid var(--line-strong); box-shadow: var(--shadow);
    transform: translateX(100%); transition: transform .25s ease; display: flex; flex-direction: column;
  }
  .drawer.open { transform: none; }
  .drawer header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .drawer header h3 { margin: 0; font-size: 14px; }
  .drawer .list { overflow-y: auto; padding: 12px 16px; }
  .entry { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; background: var(--panel); font-size: 12px; }
  .entry .meta { display: flex; justify-content: space-between; gap: 8px; color: var(--faint); }
  .entry .what { margin: 4px 0; font-weight: 600; }
  .entry .diff { color: var(--muted); white-space: pre-wrap; word-break: break-word; }
  .entry .diff del { color: var(--bad); text-decoration: line-through; }
  .entry .diff ins { color: var(--ok); text-decoration: none; }

  .lightbox { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; background: rgba(0,0,0,.82); cursor: zoom-out; padding: 20px; }
  .lightbox.open { display: grid; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; }
  .toast {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(20px); opacity: 0; z-index: 40;
    padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: 600; transition: all .2s;
    background: var(--text); color: var(--bg); pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .toast.bad { background: var(--bad); color: #fff; }

  /* Narrow windows: the side nav becomes a row of chips */
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    nav.side { border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 12px; display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; }
    .brand { display: none; }
    .navlink { width: auto; white-space: nowrap; padding: 7px 10px; }
    .toolbar { padding: 10px 14px; }
    .content { padding: 18px 14px 48px; }
    .tbtn .lbl { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<div class="app">
  <nav class="side" id="nav">
    <div class="brand">
      <div class="eyebrow">Aushadha</div>
      <div class="name">Help Centre</div>
    </div>
    <!--NAV-->
  </nav>
  <main id="main">
    <div class="toolbar">
      <label class="search">
        <svg><use href="#i-search"/></svg>
        <input id="q" type="search" placeholder="Search help…" aria-label="Search help" autocomplete="off">
      </label>
      <button class="tbtn admin-only" id="editBtn" type="button" aria-pressed="false"><svg><use href="#i-edit"/></svg><span class="lbl">Edit</span></button>
      <button class="tbtn admin-only" id="auditBtn" type="button"><svg><use href="#i-history"/></svg><span class="lbl">Audit &amp; feedback</span></button>
    </div>
    <div class="content">
      <div class="edit-banner">Edit mode: click any outlined text, change it, then click elsewhere to save. Use <b>Reset</b> to restore the original. Every change is recorded in the audit trail.</div>
      <!--CONTENT-->
      <div class="empty hidden" id="empty">No help topics match your search.</div>
    </div>
  </main>
</div>

<aside class="drawer" id="drawer" aria-label="Audit trail and feedback">
  <header><h3>Audit trail &amp; feedback</h3><button class="tbtn" id="auditClose" type="button" aria-label="Close audit trail"><svg><use href="#i-close"/></svg></button></header>
  <div class="tabs" role="tablist">
    <button type="button" class="on" data-tab="auditList" role="tab">Changes</button>
    <button type="button" data-tab="feedbackList" role="tab">Reader feedback</button>
  </div>
  <div class="list" id="auditList"></div>
  <div class="list hidden" id="feedbackList"></div>
</aside>
<div class="lightbox" id="lightbox" role="dialog" aria-label="Enlarged screenshot"><img alt=""></div>
<div class="toast" id="toast" role="status"></div>

<!-- Admin edits and audit trail (rewritten by the backend; do not edit by hand) -->
<script type="application/json" id="help-edits">{"edits": {}, "audit": []}</script>

<script>
(function () {
  'use strict';
  var parentWin = window.parent !== window ? window.parent : null;
  var store = { edits: {}, audit: [], feedback: [] };
  try { store = Object.assign(store, JSON.parse(document.getElementById('help-edits').textContent || '{}')); } catch (e) {}
  var isAdmin = false, editing = false;
  // Until the app says who is reading, show only what everyone may see. Opened on its own
  // (outside the app), the document shows everything.
  var role = parentWin ? 'patient' : 'admin';
  var nodes = Array.prototype.slice.call(document.querySelectorAll('[data-edit-id]'));
  var original = {};
  nodes.forEach(function (el) { original[el.dataset.editId] = el.textContent; });

  function byId(id) { return document.querySelector('[data-edit-id="' + id + '"]'); }
  function labelOf(id) {
    var el = byId(id);
    var sec = el && el.closest('section.sec');
    var h = sec && sec.querySelector('h2 [data-edit-id]');
    return (h ? h.textContent + ' › ' : '') + id;
  }
  function allowed(a) {
    return !a || a === 'all' || role === 'admin' || (a === 'staff' && role !== 'patient');
  }
  function applyRole() {
    document.querySelectorAll('[data-audience]').forEach(function (el) {
      el.classList.toggle('role-hidden', !allowed(el.dataset.audience));
    });
  }
  // "Updated" shows the build date or the latest admin edit, whichever is newer
  function stampUpdated() {
    var el = document.getElementById('updated');
    if (!el) return;
    var latest = new Date(el.dataset.built + 'T00:00:00');
    var times = (store.audit || []).map(function (a) { return a.at; });
    if (store.last_edit) times.push(store.last_edit);
    times.forEach(function (t) { var d = new Date(t); if (!isNaN(d) && d > latest) latest = d; });
    el.textContent = latest.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function goto(id) {
    var el = id && document.getElementById(id);
    if (!el) return;
    if (el.classList.contains('role-hidden') || (el.closest('section.sec') || el).classList.contains('role-hidden')) {
      toast('That topic is not available for your role.', true); return;
    }
    var q = document.getElementById('q');
    if (q.value) { q.value = ''; search(''); }
    if (el.tagName === 'DETAILS') {
      el.open = true;
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    } else { var first = el.querySelector('details.topic:not(.role-hidden)'); if (first) first.open = true; }
    el.scrollIntoView({ block: 'start' });
    setTimeout(trackActive, 700);
  }
  function apply() {
    nodes.forEach(function (el) {
      var id = el.dataset.editId;
      var has = Object.prototype.hasOwnProperty.call(store.edits, id);
      if (document.activeElement !== el) { el.textContent = has ? store.edits[id] : original[id]; }
      el.classList.toggle('is-edited', has);
    });
    // Nav links and quick links show the section titles, including edited ones
    document.querySelectorAll('[data-go] .nl').forEach(function (span) {
      var h = document.querySelector('#' + span.parentNode.dataset.go + ' h2 [data-edit-id]');
      if (h) span.textContent = h.textContent;
    });
    applyRole();
    stampUpdated();
    renderAudit();
    renderFeedback();
    search(document.getElementById('q').value);
  }

  // Reset buttons sit right after each editable element
  nodes.forEach(function (el) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'reset-btn'; b.textContent = 'Reset';
    b.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); send('reset', el); });
    el.insertAdjacentElement('afterend', b);
    el.addEventListener('blur', function () {
      if (!editing) return;
      var text = el.innerText.replace(/ /g, ' ').trim();
      var current = Object.prototype.hasOwnProperty.call(store.edits, el.dataset.editId) ? store.edits[el.dataset.editId] : original[el.dataset.editId];
      if (!text) { el.textContent = current; toast('Text cannot be empty. Use Reset to restore the original.', true); return; }
      if (text !== current.trim()) send('save', el, text);
    });
    el.addEventListener('keydown', function (e) {
      if (!editing) return;
      if (e.key === 'Escape') { el.textContent = store.edits[el.dataset.editId] || original[el.dataset.editId]; el.blur(); }
      if (e.key === 'Enter' && !e.shiftKey && el.tagName !== 'P') { e.preventDefault(); el.blur(); }
    });
    // In edit mode a click on a topic title edits it instead of folding the topic
    el.addEventListener('click', function (e) { if (editing && el.closest('summary')) e.preventDefault(); });
  });

  function send(kind, el, text) {
    if (!parentWin) { toast('Open the Help Centre from the app to save changes.', true); return; }
    el.classList.add('saving');
    parentWin.postMessage({ type: kind, id: el.dataset.editId, text: text }, '*');
  }

  function setEditing(on) {
    editing = on && isAdmin;
    document.body.classList.toggle('editing', editing);
    var btn = document.getElementById('editBtn');
    btn.classList.toggle('on', editing); btn.setAttribute('aria-pressed', String(editing));
    btn.querySelector('.lbl').textContent = editing ? 'Done' : 'Edit';
    nodes.forEach(function (el) {
      if (editing) { el.setAttribute('contenteditable', 'plaintext-only'); if (el.contentEditable !== 'plaintext-only') el.setAttribute('contenteditable', 'true'); }
      else el.removeAttribute('contenteditable');
    });
  }

  // Audit trail, newest first. Built with textContent only.
  function renderAudit() {
    var list = document.getElementById('auditList');
    list.textContent = '';
    var items = (store.audit || []).slice().reverse();
    if (!items.length) { var p = document.createElement('p'); p.className = 'empty'; p.textContent = 'No changes yet.'; list.appendChild(p); return; }
    items.forEach(function (a) {
      var d = document.createElement('div'); d.className = 'entry';
      var meta = document.createElement('div'); meta.className = 'meta';
      var who = document.createElement('span'); who.textContent = a.by || 'unknown';
      var when = document.createElement('span'); when.textContent = a.at ? new Date(a.at).toLocaleString() : '';
      meta.appendChild(who); meta.appendChild(when);
      var what = document.createElement('div'); what.className = 'what';
      what.textContent = (a.action === 'reset' ? 'Reset ' : 'Edited ') + labelOf(a.section);
      var diff = document.createElement('div'); diff.className = 'diff';
      var del = document.createElement('del'); del.textContent = a.before == null ? (original[a.section] || '(original)') : a.before;
      var ins = document.createElement('ins'); ins.textContent = a.after == null ? (original[a.section] || '(original)') : a.after;
      diff.appendChild(del); diff.appendChild(document.createTextNode('\n→ ')); diff.appendChild(ins);
      d.appendChild(meta); d.appendChild(what); d.appendChild(diff); list.appendChild(d);
    });
  }

  // Reader feedback (admins only): score, then comments newest first
  function renderFeedback() {
    var list = document.getElementById('feedbackList');
    list.textContent = '';
    var items = store.feedback || [];
    var yes = items.filter(function (f) { return f.helpful; }).length;
    var score = document.createElement('div'); score.className = 'score';
    [[items.length, 'responses'], [items.length ? Math.round(100 * yes / items.length) + '%' : '–', 'found it helpful'], [items.length - yes, 'not helpful']].forEach(function (x) {
      var d = document.createElement('div'); var b = document.createElement('b'); b.textContent = x[0];
      var sp = document.createElement('span'); sp.textContent = x[1]; d.appendChild(b); d.appendChild(sp); score.appendChild(d);
    });
    list.appendChild(score);
    items.slice().reverse().forEach(function (f) {
      var d = document.createElement('div'); d.className = 'entry';
      var meta = document.createElement('div'); meta.className = 'meta';
      var who = document.createElement('span'); who.textContent = f.by || 'unknown';
      var when = document.createElement('span'); when.textContent = f.at ? new Date(f.at).toLocaleString() : '';
      meta.appendChild(who); meta.appendChild(when);
      var what = document.createElement('div'); what.className = 'what'; what.textContent = f.helpful ? 'Helpful' : 'Not helpful';
      d.appendChild(meta); d.appendChild(what);
      if (f.comment) { var c = document.createElement('div'); c.className = 'diff'; c.textContent = f.comment; d.appendChild(c); }
      list.appendChild(d);
    });
  }
  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
      ['auditList', 'feedbackList'].forEach(function (id) { document.getElementById(id).classList.toggle('hidden', id !== b.dataset.tab); });
    });
  });

  // The frame is sandboxed, so mail links are opened by the app
  document.querySelectorAll('a.support-link').forEach(function (a) {
    a.addEventListener('click', function (e) {
      if (!parentWin) return;
      e.preventDefault();
      parentWin.postMessage({ type: 'contact', href: a.getAttribute('href') }, '*');
    });
  });

  // Search: hide topics that don't match, highlight matches in titles
  function search(q) {
    q = (q || '').trim().toLowerCase();
    var any = false;
    document.querySelectorAll('section.sec').forEach(function (sec) {
      var secHit = false;
      sec.querySelectorAll('details.topic').forEach(function (t) {
        if (t.classList.contains('role-hidden')) return;
        var hit = !q || t.textContent.toLowerCase().indexOf(q) !== -1;
        t.classList.toggle('hidden', !hit);
        if (q && hit) t.open = true;
        secHit = secHit || hit;
      });
      var headHit = !q || sec.querySelector('.sec-head').textContent.toLowerCase().indexOf(q) !== -1;
      sec.classList.toggle('hidden', !(secHit || headHit));
      if (headHit && q && !secHit) sec.querySelectorAll('details.topic').forEach(function (t) { t.classList.remove('hidden'); });
      if (sec.classList.contains('role-hidden')) sec.classList.add('hidden');
      if (!sec.classList.contains('role-hidden')) any = any || secHit || headHit;
    });
    document.getElementById('empty').classList.toggle('hidden', any);
    document.querySelectorAll('.hero').forEach(function (h) { h.classList.toggle('hidden', !!q); });
  }
  document.getElementById('q').addEventListener('input', function (e) { search(e.target.value); });

  // Navigation: scroll to a section and track the active one
  document.querySelectorAll('[data-go]').forEach(function (b) { b.addEventListener('click', function () { goto(b.dataset.go); }); });
  var links = Array.prototype.slice.call(document.querySelectorAll('.navlink'));
  var main = document.getElementById('main');
  // Highlight the section being read: the last visible one whose top has passed the toolbar
  function trackActive() {
    var mainTop = main.getBoundingClientRect().top, current = null;
    document.querySelectorAll('section.sec:not(.role-hidden):not(.hidden)').forEach(function (s) {
      if (s.getBoundingClientRect().top - mainTop < 120) current = s.id;
    });
    links.forEach(function (l) {
      var on = l.dataset.go === current;
      if (on && !l.classList.contains('active')) l.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      l.classList.toggle('active', on);
    });
  }
  var trackTimer;
  main.addEventListener('scroll', function () { clearTimeout(trackTimer); trackTimer = setTimeout(trackActive, 60); }, { passive: true });

  // Screenshots open enlarged
  var lb = document.getElementById('lightbox');
  document.querySelectorAll('figure img').forEach(function (img) {
    img.addEventListener('click', function () { if (editing) return; lb.querySelector('img').src = img.src; lb.querySelector('img').alt = img.alt; lb.classList.add('open'); });
    img.addEventListener('error', function () { img.closest('figure').classList.add('hidden'); });
  });
  lb.addEventListener('click', function () { lb.classList.remove('open'); });

  document.getElementById('editBtn').addEventListener('click', function () { setEditing(!editing); });
  document.getElementById('auditBtn').addEventListener('click', function () { document.getElementById('drawer').classList.add('open'); });
  document.getElementById('auditClose').addEventListener('click', function () { document.getElementById('drawer').classList.remove('open'); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { lb.classList.remove('open'); document.getElementById('drawer').classList.remove('open'); }
  });

  var toastTimer;
  function toast(text, bad) {
    var t = document.getElementById('toast');
    t.textContent = text; t.className = 'toast show' + (bad ? ' bad' : '');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.className = 'toast'; }, 2600);
  }

  // Messages from the app's Help Centre window
  window.addEventListener('message', function (e) {
    if (!parentWin || e.source !== parentWin) return;
    var m = e.data || {};
    if (m.type === 'init' || m.type === 'theme') {
      document.documentElement.setAttribute('data-theme', m.theme === 'light' ? 'light' : 'dark');
    }
    if (m.type === 'init') {
      isAdmin = !!m.isAdmin;
      role = isAdmin ? 'admin' : (m.role === 'patient' ? 'patient' : 'staff');
      document.body.classList.toggle('is-admin', isAdmin);
      apply();
      if (m.topic) goto(m.topic);
    }
    if (m.type === 'goto') goto(m.id);
    if (m.type === 'saved' || m.type === 'error') {
      var el = byId(m.id);
      if (el) el.classList.remove('saving');
      if (m.type === 'saved' && m.data) { store.edits = m.data.edits || {}; store.audit = m.data.audit || []; store.feedback = m.data.feedback || store.feedback; if (el) el.blur(); apply(); toast('Saved'); }
      else { apply(); toast(m.message || 'Could not save', true); }
    }
  });

  apply();
  if (!parentWin && location.hash) goto(location.hash.slice(1));
  if (parentWin) parentWin.postMessage({ type: 'ready' }, '*');
})();
</script>
</body>
</html>
